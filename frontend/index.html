<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7d6e0, #d6e4ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    p {
      color: #666;
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
    }

    .error {
      color: #c0392b;
    }

    .success {
      color: #1e8449;
    }

    .small-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- LOGIN -->
    <div class="card">
      <h1>Gym Tracker</h1>
      <p>Log in to continue</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" placeholder="Enter your password" required />
        </div>

        <button type="submit">Log In</button>
      </form>

      <div class="message error" id="loginMessage"></div>
    </div>

    <!-- REGISTER -->
    <div class="card">
      <h2>Create Account</h2>
      <div class="small-text">Don’t have an account yet? Register here.</div>

      <form id="registerForm">
        <div class="form-group">
          <label for="registerName">Name</label>
          <input id="registerName" type="text" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input id="registerEmail" type="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" type="password" placeholder="Create a password" required />
        </div>

        <div class="form-group">
          <label for="registerAge">Age</label>
          <input id="registerAge" type="number" placeholder="Enter your age" required />
        </div>

        <div class="form-group">
          <label for="registerWeight">Weight</label>
          <input id="registerWeight" type="number" placeholder="Enter your weight in kg" required />
        </div>

        <button type="submit">Register</button>
      </form>

      <div class="message" id="registerMessage"></div>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginMessage = document.getElementById("loginMessage");
    const registerMessage = document.getElementById("registerMessage");

    // LOGIN
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMessage.textContent = "";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      try {
        const res = await fetch("http://127.0.0.1:3000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          loginMessage.textContent = data.message;
          return;
        }

        localStorage.setItem("loggedInUser", JSON.stringify(data));
        window.location.href = "dashboard.html";
      } catch (error) {
        loginMessage.textContent = "Could not connect to the server.";
        console.error(error);
      }
    });

    // REGISTER
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      registerMessage.textContent = "";
      registerMessage.className = "message";

      const name = document.getElementById("registerName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const password = document.getElementById("registerPassword").value.trim();
      const age = Number(document.getElementById("registerAge").value);
      const weight = Number(document.getElementById("registerWeight").value);

      try {
        const res = await fetch("http://127.0.0.1:3000/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, email, password, age, weight })
        });

        const data = await res.json();

        if (!res.ok) {
          registerMessage.textContent = data.message;
          registerMessage.classList.add("error");
          return;
        }

        registerMessage.textContent = "Account created successfully. You can now log in.";
        registerMessage.classList.add("success");

        registerForm.reset();
      } catch (error) {
        registerMessage.textContent = "Could not connect to the server.";
        registerMessage.classList.add("error");
        console.error(error);
      }
    });
  </script>
</body>
</html>
